<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

.eqbk-root {
  --bg: #F5F4F0;
  --panel: #FFFFFF;
  --border: #DDD9D0;
  --text: #20241F;
  --muted: #6B6F68;
  --accent: #2D6E5E;
  --accent-soft: #E6EFEC;
  --danger: #A13D3D;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
}
.eqbk-root * { box-sizing: border-box; }
.eqbk-root h1, .eqbk-root h2, .eqbk-root .eqbk-display {
  font-family: 'Space Grotesk', sans-serif;
}
.eqbk-mono { font-family: 'IBM Plex Mono', monospace; }

.eqbk-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 4px;
}
.eqbk-header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}
.eqbk-sub {
  color: var(--muted);
  font-size: 12px;
  margin: 2px 0 16px;
}
.eqbk-sync {
  font-size: 11px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
}

.eqbk-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.eqbk-nav button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.eqbk-nav button:hover { background: var(--accent-soft); border-color: var(--accent); }
.eqbk-nav .eqbk-month-label {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 17px;
  min-width: 110px;
  text-align: center;
}
.eqbk-add-btn {
  margin-left: auto;
  background: var(--accent) !important;
  color: white !important;
  border-color: var(--accent) !important;
  font-weight: 600;
}

.eqbk-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 18px;
}
.eqbk-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table.eqbk-grid {
  border-collapse: collapse;
  width: 100%;
  min-width: 640px;
}
table.eqbk-grid th, table.eqbk-grid td {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0;
  text-align: center;
}
table.eqbk-grid thead th {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
  padding: 6px 2px;
  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 2;
}
table.eqbk-grid thead th.eqbk-weekend { color: var(--danger); }
table.eqbk-grid thead th.eqbk-today-col { background: var(--accent-soft); color: var(--accent); }
table.eqbk-grid td.eqbk-eqname {
  position: sticky;
  left: 0;
  background: var(--panel);
  z-index: 1;
  text-align: left;
  padding: 8px 10px;
  min-width: 130px;
  max-width: 150px;
}
table.eqbk-grid th.eqbk-corner {
  position: sticky;
  left: 0;
  top: 0;
  z-index: 3;
  background: var(--panel);
  min-width: 130px;
}
.eqbk-eq-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.03em;
  display: block;
}
.eqbk-eq-name {
  font-size: 13px;
  font-weight: 600;
  cursor: text;
  border-bottom: 1px dashed transparent;
}
.eqbk-eq-name:hover { border-bottom: 1px dashed var(--muted); }
td.eqbk-cell {
  width: 28px;
  height: 34px;
  cursor: pointer;
  position: relative;
}
td.eqbk-cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
td.eqbk-cell.eqbk-today { background: var(--accent-soft); }
.eqbk-seg {
  position: absolute;
  top: 4px;
  bottom: 4px;
  border-radius: 3px;
}
.eqbk-badge {
  position: absolute;
  bottom: 1px;
  right: 2px;
  font-size: 8px;
  color: white;
  font-family: 'IBM Plex Mono', monospace;
  background: rgba(0,0,0,0.35);
  border-radius: 3px;
  padding: 0 2px;
  z-index: 2;
}

.eqbk-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 14px;
  font-size: 12px;
  border-top: 1px solid var(--border);
  background: #FBFBFA;
}
.eqbk-legend-item { display: flex; align-items: center; gap: 5px; }
.eqbk-dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.eqbk-upcoming h2 {
  font-size: 14px;
  margin: 0 0 8px;
}
.eqbk-upcoming-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.eqbk-upcoming-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.eqbk-upcoming-item .eqbk-dot { flex-shrink: 0; }
.eqbk-upcoming-meta { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.eqbk-empty { color: var(--muted); font-size: 12.5px; padding: 4px 0; }

.eqbk-overlay {
  position: fixed; inset: 0;
  background: rgba(20,24,20,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 50;
}
@media (min-width: 640px) {
  .eqbk-overlay { align-items: center; }
}
.eqbk-modal {
  background: var(--panel);
  border-radius: 14px 14px 0 0;
  width: 100%; max-width: 420px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px 18px 20px;
}
@media (min-width: 640px) {
  .eqbk-modal { border-radius: 14px; }
}
.eqbk-modal h2 { font-size: 16px; margin: 0 0 3px; }
.eqbk-modal .eqbk-modal-sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; font-family: 'IBM Plex Mono', monospace; }
.eqbk-modal label {
  display: block; font-size: 11.5px; color: var(--muted); margin: 10px 0 4px; font-weight: 600;
}
.eqbk-modal input, .eqbk-modal select, .eqbk-modal textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13.5px; font-family: 'Inter', sans-serif; background: #FCFCFB;
}
.eqbk-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.eqbk-btn-primary, .eqbk-btn-secondary {
  flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
}
.eqbk-btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.eqbk-btn-secondary { background: var(--panel); color: var(--text); }
.eqbk-modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.eqbk-existing-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.eqbk-existing-item {
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  display: flex; justify-content: space-between; align-items: center; font-size: 12.5px;
}
.eqbk-existing-item { flex-wrap: wrap; }
.eqbk-existing-item button {
  border: none; background: none; color: var(--danger); cursor: pointer; font-size: 11.5px; font-weight: 600;
}
.eqbk-existing-main { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; flex: 1; }
.eqbk-existing-actions { display: flex; align-items: center; gap: 10px; }
.eqbk-status-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
}
.eqbk-status-scheduled { background: var(--accent-soft); color: var(--accent); }
.eqbk-status-active { background: #FBEBD9; color: #B5541D; }
.eqbk-status-ended { background: #EDEDEA; color: var(--muted); }
.eqbk-end-btn {
  border: 1px solid var(--danger) !important;
  color: var(--danger) !important;
  border-radius: 6px;
  padding: 3px 8px !important;
  font-size: 11px !important;
}
.eqbk-fab {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--accent); color: white; border: none; border-radius: 50%;
  width: 52px; height: 52px; font-size: 26px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(45,110,94,0.4); z-index: 40;
}
.eqbk-mode-btn.eqbk-mode-active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
table.eqbk-grid thead th.eqbk-day-header { cursor: pointer; }
table.eqbk-grid thead th.eqbk-day-header:hover { background: var(--accent-soft); }

table.eqbk-week-table { min-width: 900px; }
td.eqbk-week-cell {
  min-width: 130px;
  vertical-align: top;
  padding: 6px;
  cursor: pointer;
}
td.eqbk-week-cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
td.eqbk-week-cell.eqbk-today { background: var(--accent-soft); }
.eqbk-week-chip {
  border-radius: 6px;
  padding: 5px 7px;
  margin-bottom: 5px;
  text-align: left;
}
.eqbk-week-chip-person { font-size: 12px; font-weight: 700; line-height: 1.3; }
.eqbk-week-chip-time { font-size: 10px; font-family: 'IBM Plex Mono', monospace; opacity: 0.9; margin-top: 1px; }
.eqbk-week-chip-status { font-size: 9px; margin-top: 3px; font-weight: 700; letter-spacing: 0.02em; }

.eqbk-status-maintenance { background: #FBEBD9; color: #B5541D; }
.eqbk-status-broken { background: #F4DEDE; color: var(--danger); }
.eqbk-eq-tag-btn { cursor: pointer; }
.eqbk-eq-tag-btn:hover { text-decoration: underline; }
td.eqbk-cell.eqbk-cell-unavailable, td.eqbk-week-cell.eqbk-cell-unavailable {
  background: repeating-linear-gradient(45deg, #F2ECE6, #F2ECE6 6px, #E9DFD6 6px, #E9DFD6 12px);
}
.eqbk-edit-btn {
  border: 1px solid var(--accent) !important;
  color: var(--accent) !important;
  border-radius: 6px;
  padding: 3px 8px !important;
  font-size: 11px !important;
}
.eqbk-checkbox-row {
  display: flex; align-items: center; gap: 7px;
  margin: 12px 0 0; font-size: 12.5px; font-weight: 600; color: var(--text);
}
.eqbk-checkbox-row input { width: auto; }
.eqbk-status-choice-group { display: flex; gap: 8px; margin-top: 4px; }
.eqbk-status-choice {
  flex: 1; padding: 9px 6px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
}
.eqbk-status-choice.eqbk-status-choice-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.eqbk-stats { margin-top: 18px; }
.eqbk-stats h2 { font-size: 14px; margin: 0 0 8px; }
.eqbk-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .eqbk-stats-grid { grid-template-columns: 1fr; } }
.eqbk-stats-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.eqbk-stats-card h3 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 700; }
.eqbk-stats-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.eqbk-stats-row:last-child { border-bottom: none; }
.eqbk-stats-val { font-family: 'IBM Plex Mono', monospace; color: var(--muted); }
.eqbk-hint { font-size: 11px; color: var(--muted); }

</style>

<script>
// ==========================================================

// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 에서
// "구성" 형식으로 확인할 수 있습니다.

const firebaseConfig = {
  apiKey: "AIzaSyBqqy0N_v3kvgjXIVqKXjUqOzlgJ1DmQjY",
  authDomain: "furnace-booking.firebaseapp.com",
  databaseURL: "https://furnace-booking-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "furnace-booking",
  storageBucket: "furnace-booking.firebasestorage.app",

<script>
(function(){
  const PERSON_COLORS = ['#2D6E5E','#B5541D','#3D5A80','#8E4585','#4C7031','#A13D3D','#5B5F97','#C08A2E','#1F6F78','#8A5A2E'];
  const DAY_LABELS = ['일','월','화','수','목','금','토'];
  const DEFAULT_NAMES = ['대형로','중형로','소형로','Furnace#1','Furnace#2','Furnace#3','Furnace#4'];
  const OLD_DEFAULT_NAMES = [1,2,3,4,5,6,7].map(n => '장비 '+n);

  let equipment = [];
  let reservations = [];
  let people = [];
  let viewDate = new Date();
  let viewMode = 'week'; // 'month' | 'week'
  let weekAnchor = getWeekStart(new Date());
  let modalState = null; // {mode:'day', equipmentId, dateStr} or {mode:'new'}
  let eqRef, resRef, pplRef;

  function getWeekStart(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - x.getDay());
    return x;
  }

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function colorForPerson(name){
    let h = 0;
    for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return PERSON_COLORS[h % PERSON_COLORS.length];
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function toLocalInput(d){ return dateStr(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function eqStatusLabel(eq){
    if (!eq.status || eq.status === 'ok') return null;
    return eq.status === 'maintenance' ? '🔧 점검중' : '⛔ 고장';
  }

  function computeMonthStats(year, month){
    const monthStart = new Date(year, month, 1).getTime();
    const monthEnd = new Date(year, month+1, 1).getTime();
    const perEquipment = {};
    const perPerson = {};
    reservations.forEach(r => {
      const s = Math.max(new Date(r.start).getTime(), monthStart);
      const e = Math.min(new Date(r.end).getTime(), monthEnd);
      if (e <= s) return;
      const hours = (e - s) / 3600000;
      if (!perEquipment[r.equipmentId]) perEquipment[r.equipmentId] = { hours: 0, count: 0 };
      perEquipment[r.equipmentId].hours += hours;
      perEquipment[r.equipmentId].count += 1;
      perPerson[r.person] = (perPerson[r.person] || 0) + hours;
    });
    return { perEquipment, perPerson };
  }

  async function initFirebaseData(){
    const snap = await eqRef.once('value');
    if (!snap.exists()){
      const defaults = DEFAULT_NAMES.map((name, i) => ({ id: 'eq'+(i+1), tag: 'EQ-0'+(i+1), name }));
      await eqRef.set(defaults);
    }
  }

  function toArray(val){
    if (!val) return [];
    return Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
  }

  function attachListeners(){
    eqRef.on('value', snap => {
      equipment = toArray(snap.val());
      const isOldDefault = equipment.length === OLD_DEFAULT_NAMES.length &&
        equipment.every((e,i) => e.name === OLD_DEFAULT_NAMES[i]);
      if (isOldDefault){
        equipment.forEach((e,i) => { e.name = DEFAULT_NAMES[i]; });
        eqRef.set(equipment);
        return;
      }
      if (!modalState) render();
    });
    resRef.on('value', snap => {
      reservations = toArray(snap.val());
      if (!modalState) render();
    });
    pplRef.on('value', snap => {
      people = toArray(snap.val());
      if (!modalState) render();
    });
  }

  function saveReservations(){ return resRef.set(reservations); }
  function saveEquipment(){ return eqRef.set(equipment); }
  function savePeople(){ return pplRef.set(people); }

  function reservationsForEquipmentOnDay(eqId, day){
    const dayStart = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0,0,0);
    const dayEnd = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 23,59,59);
    return reservations.filter(r => r.equipmentId === eqId &&
      new Date(r.start) <= dayEnd && new Date(r.end) >= dayStart
    ).sort((a,b)=> new Date(a.start) - new Date(b.start));
  }

  function getStatus(r){
    if (r.endedAt) return 'ended';
    const now = new Date();
    if (now < new Date(r.start)) return 'scheduled';
    return 'active'; // within or past the reserved window but not manually ended
  }
  function statusLabel(status){
    if (status === 'ended') return '사용종료';
    if (status === 'active') return '사용중';
    return '예약됨';
  }

  function fmtRange(r){
    const s = new Date(r.start), e = new Date(r.end);
    const sameDay = s.toDateString() === e.toDateString();
    const timeFmt = d => pad(d.getHours())+':'+pad(d.getMinutes());
    const dateFmt = d => (d.getMonth()+1)+'/'+d.getDate();
    if (sameDay) return dateFmt(s) + ' ' + timeFmt(s) + '–' + timeFmt(e);
    return dateFmt(s) + ' ' + timeFmt(s) + ' → ' + dateFmt(e) + ' ' + timeFmt(e);
  }

  function buildMonthTableHtml(year, month, daysInMonth, today, isThisMonth){
    let html = '<table class="eqbk-grid"><thead><tr><th class="eqbk-corner">장비</th>';
    for (let d=1; d<=daysInMonth; d++){
      const dt = new Date(year, month, d);
      const isToday = isThisMonth && d === today.getDate();
      const wd = dt.getDay();
      const cls = 'eqbk-day-header ' + ((wd===0||wd===6) ? 'eqbk-weekend' : (isToday ? 'eqbk-today-col' : ''));
      html += '<th class="'+cls+'" data-date="'+dateStr(dt)+'" title="클릭하면 이 주를 크게 보기">'+d+'<br>'+DAY_LABELS[wd]+'</th>';
    }
    html += '</tr></thead><tbody>';

    equipment.forEach(eq => {
      const badge = eqStatusLabel(eq);
      const unavailable = !!badge;
      html += '<tr><td class="eqbk-eqname"><span class="eqbk-eq-tag eqbk-eq-tag-btn" data-eqid="'+eq.id+'" title="눌러서 장비 상태 변경">'+eq.tag+'</span><span class="eqbk-eq-name" data-eqid="'+eq.id+'" title="눌러서 이름 수정">'+eq.name+'</span>'
        + (badge ? ' <span class="eqbk-status-badge eqbk-status-'+eq.status+'">'+badge+'</span>' : '') + '</td>';
      for (let d=1; d<=daysInMonth; d++){
        const dt = new Date(year, month, d);
        const isToday = isThisMonth && d === today.getDate();
        const list = reservationsForEquipmentOnDay(eq.id, dt);
        let inner = '';
        if (list.length > 0){
          const dayStartMs = dt.getTime();
          const dayEndMs = dayStartMs + 86400000;
          list.forEach(r => {
            const rStart = Math.max(new Date(r.start).getTime(), dayStartMs);
            const rEnd = Math.min(new Date(r.end).getTime(), dayEndMs);
            if (rEnd <= rStart) return;
            const leftPct = ((rStart - dayStartMs) / 86400000) * 100;
            const widthPct = Math.max(((rEnd - rStart) / 86400000) * 100, 6);
            const st = getStatus(r);
            const color = st === 'ended' ? '#B9B7AE' : colorForPerson(r.person);
            const opacity = st === 'scheduled' ? 0.5 : (st === 'ended' ? 0.65 : 0.9);
            inner += '<div class="eqbk-seg" style="left:'+leftPct.toFixed(2)+'%;width:'+widthPct.toFixed(2)+'%;background:'+color+';opacity:'+opacity+'" title="'+r.person+' · '+fmtRange(r)+'"></div>';
          });
          if (list.length > 3) inner += '<span class="eqbk-badge">'+list.length+'</span>';
        }
        html += '<td class="eqbk-cell '+(isToday?'eqbk-today':'')+(unavailable?' eqbk-cell-unavailable':'')+'" data-eqid="'+eq.id+'" data-date="'+dateStr(dt)+'">'+inner+'</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function buildWeekTableHtml(){
    const days = [];
    for (let i=0;i<7;i++){ const dt = new Date(weekAnchor); dt.setDate(dt.getDate()+i); days.push(dt); }
    const today = new Date();

    let html = '<table class="eqbk-grid eqbk-week-table"><thead><tr><th class="eqbk-corner">장비</th>';
    days.forEach(dt => {
      const wd = dt.getDay();
      const isToday = dt.toDateString() === today.toDateString();
      const cls = ((wd===0||wd===6) ? 'eqbk-weekend' : '') + (isToday ? ' eqbk-today-col' : '');
      html += '<th class="'+cls+'">'+(dt.getMonth()+1)+'/'+dt.getDate()+'<br>'+DAY_LABELS[wd]+'</th>';
    });
    html += '</tr></thead><tbody>';

    equipment.forEach(eq => {
      const badge = eqStatusLabel(eq);
      const unavailable = !!badge;
      html += '<tr><td class="eqbk-eqname"><span class="eqbk-eq-tag eqbk-eq-tag-btn" data-eqid="'+eq.id+'" title="눌러서 장비 상태 변경">'+eq.tag+'</span><span class="eqbk-eq-name" data-eqid="'+eq.id+'" title="눌러서 이름 수정">'+eq.name+'</span>'
        + (badge ? ' <span class="eqbk-status-badge eqbk-status-'+eq.status+'">'+badge+'</span>' : '') + '</td>';
      days.forEach(dt => {
        const isToday = dt.toDateString() === today.toDateString();
        const dayStart = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 0,0,0);
        const dayEnd = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 23,59,59);
        const list = reservationsForEquipmentOnDay(eq.id, dt);
        let inner = '';
        list.forEach(r => {
          const st = getStatus(r);
          const s = new Date(r.start), e = new Date(r.end);
          const startsBefore = s < dayStart;
          const endsAfter = e > dayEnd;
          const timeLabel = (startsBefore ? '⋯' : pad(s.getHours())+':'+pad(s.getMinutes()))
            + '–' + (endsAfter ? '⋯' : pad(e.getHours())+':'+pad(e.getMinutes()));
          const bg = st === 'ended' ? '#D9D7CE' : colorForPerson(r.person);
          const textColor = st === 'ended' ? 'var(--text)' : '#fff';
          const opacity = st === 'scheduled' ? 0.7 : (st === 'ended' ? 0.85 : 1);
          inner += '<div class="eqbk-week-chip" style="background:'+bg+';color:'+textColor+';opacity:'+opacity+'">'
            + '<div class="eqbk-week-chip-person">'+r.person+(r.seriesId ? ' 🔁' : '')+'</div>'
            + '<div class="eqbk-week-chip-time">'+timeLabel+'</div>'
            + '<div class="eqbk-week-chip-status">'+statusLabel(st)+'</div></div>';
        });
        html += '<td class="eqbk-week-cell '+(isToday?'eqbk-today':'')+(unavailable?' eqbk-cell-unavailable':'')+'" data-eqid="'+eq.id+'" data-date="'+dateStr(dt)+'">'+inner+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function render(){
    const app = document.getElementById('eqbk-app');
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const today = new Date();
    const isThisMonth = today.getFullYear()===year && today.getMonth()===month;

    let html = '';
    html += '<div class="eqbk-header"><h1>🔧 장비 예약 보드</h1><div class="eqbk-sync">🔥 Firebase 실시간 연결됨</div></div>';
    html += '<div class="eqbk-sub">셀을 눌러 해당 날짜의 예약을 보거나 추가하세요 · 장비 이름을 눌러 수정할 수 있어요</div>';

    html += '<div class="eqbk-nav">';
    html += '<button class="eqbk-mode-btn '+(viewMode==='month'?'eqbk-mode-active':'')+'" id="eqbk-mode-month">월간 요약</button>';
    html += '<button class="eqbk-mode-btn '+(viewMode==='week'?'eqbk-mode-active':'')+'" id="eqbk-mode-week">주간 상세</button>';
    if (viewMode === 'month'){
      html += '<button id="eqbk-prev">← 이전달</button>';
      html += '<div class="eqbk-month-label">'+year+'년 '+(month+1)+'월</div>';
      html += '<button id="eqbk-next">다음달 →</button>';
      html += '<button id="eqbk-today2">오늘</button>';
    } else {
      const weekEnd = new Date(weekAnchor); weekEnd.setDate(weekEnd.getDate()+6);
      const wLabel = (weekAnchor.getMonth()+1)+'/'+weekAnchor.getDate()+' – '+(weekEnd.getMonth()+1)+'/'+weekEnd.getDate();
      html += '<button id="eqbk-week-prev">← 지난주</button>';
      html += '<div class="eqbk-month-label">'+wLabel+'</div>';
      html += '<button id="eqbk-week-next">다음주 →</button>';
      html += '<button id="eqbk-week-today">이번주</button>';
    }
    html += '<button class="eqbk-add-btn" id="eqbk-new-top">+ 예약 추가</button>';
    html += '</div>';

    html += '<div class="eqbk-panel"><div class="eqbk-scroll">';
    if (viewMode === 'month') html += buildMonthTableHtml(year, month, daysInMonth, today, isThisMonth);
    else html += buildWeekTableHtml();
    html += '</div>';

    const uniquePeople = [...new Set(reservations.map(r=>r.person))];
    html += '<div class="eqbk-legend">';
    if (uniquePeople.length === 0) html += '<span class="eqbk-empty">아직 예약이 없어요</span>';
    uniquePeople.forEach(p => {
      html += '<div class="eqbk-legend-item"><span class="eqbk-dot" style="background:'+colorForPerson(p)+'"></span>'+p+'</div>';
    });
    html += '</div></div>';

    // upcoming list (next 7 days, all equipment)
    const now = new Date();
    const in7 = new Date(now.getTime() + 7*86400000);
    const upcoming = reservations
      .filter(r => new Date(r.end) >= now && new Date(r.start) <= in7)
      .sort((a,b)=> new Date(a.start) - new Date(b.start));
    html += '<div class="eqbk-upcoming"><h2>📅 앞으로 7일간 예약</h2>';
    if (upcoming.length === 0) html += '<div class="eqbk-empty">예정된 예약이 없어요</div>';
    else {
      html += '<div class="eqbk-upcoming-list">';
      upcoming.forEach(r => {
        const eq = equipment.find(e=>e.id===r.equipmentId);
        const st = getStatus(r);
        html += '<div class="eqbk-upcoming-item"><span class="eqbk-dot" style="background:'+colorForPerson(r.person)+'"></span>'
          + '<strong>'+(eq?eq.name:'?')+'</strong> · '+r.person
          + '<span class="eqbk-status-badge eqbk-status-'+st+'">'+statusLabel(st)+'</span>'
          + '<span class="eqbk-upcoming-meta" style="margin-left:auto">'+fmtRange(r)+'</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // usage stats for the month currently in view
    const statsYear = viewMode === 'month' ? year : weekAnchor.getFullYear();
    const statsMonth = viewMode === 'month' ? month : weekAnchor.getMonth();
    const stats = computeMonthStats(statsYear, statsMonth);
    const eqStatsSorted = equipment
      .map(eq => ({ eq, data: stats.perEquipment[eq.id] || { hours: 0, count: 0 } }))
      .sort((a,b) => b.data.hours - a.data.hours);
    const personStatsSorted = Object.entries(stats.perPerson).sort((a,b) => b[1]-a[1]).slice(0, 5);
    html += '<div class="eqbk-stats"><h2>📊 '+statsYear+'년 '+(statsMonth+1)+'월 사용 통계</h2><div class="eqbk-stats-grid">';
    html += '<div class="eqbk-stats-card"><h3>장비별 사용시간</h3>';
    eqStatsSorted.forEach(({eq, data}) => {
      html += '<div class="eqbk-stats-row"><span>'+eq.name+'</span><span class="eqbk-stats-val">'+data.hours.toFixed(1)+'시간 · '+data.count+'건</span></div>';
    });
    html += '</div>';
    html += '<div class="eqbk-stats-card"><h3>사용자별 사용시간 (상위 5명)</h3>';
    if (personStatsSorted.length === 0) html += '<div class="eqbk-empty">아직 데이터가 없어요</div>';
    personStatsSorted.forEach(([name, hours]) => {
      html += '<div class="eqbk-stats-row"><span>'+name+'</span><span class="eqbk-stats-val">'+hours.toFixed(1)+'시간</span></div>';
    });
    html += '</div></div></div>';

    html += '<button class="eqbk-fab" id="eqbk-fab" title="예약 추가">+</button>';

    if (modalState) html += renderModal();

    app.innerHTML = html;
    attachHandlers();
  }

  function renderModal(){
    if (modalState.mode === 'equipmentStatus') return renderEquipmentStatusModal();

    const peopleOptions = people.map(p=>'<option value="'+p+'">').join('');
    const editingRes = modalState.editingId ? reservations.find(r=>r.id===modalState.editingId) : null;
    let defaultEq = (editingRes && editingRes.equipmentId) || modalState.equipmentId || (equipment[0] && equipment[0].id);
    let defaultDate = modalState.dateStr || dateStr(new Date());
    let startVal = editingRes ? editingRes.start : (defaultDate + 'T09:00');
    let endVal = editingRes ? editingRes.end : (defaultDate + 'T18:00');
    let personVal = editingRes ? editingRes.person : '';
    let noteVal = editingRes ? (editingRes.note || '') : '';

    let html = '<div class="eqbk-overlay" id="eqbk-overlay"><div class="eqbk-modal">';
    html += '<button class="eqbk-modal-close" id="eqbk-modal-close">✕</button>';

    if (modalState.mode === 'day'){
      const eq = equipment.find(e=>e.id===modalState.equipmentId);
      const list = reservationsForEquipmentOnDay(modalState.equipmentId, new Date(modalState.dateStr));
      html += '<h2>'+(eq?eq.name:'')+'</h2><div class="eqbk-modal-sub">'+modalState.dateStr+'</div>';
      html += '<div class="eqbk-existing-list">';
      if (list.length === 0) html += '<div class="eqbk-empty">이 날짜에 예약이 없어요</div>';
      list.forEach(r => {
        const st = getStatus(r);
        html += '<div class="eqbk-existing-item">'
          + '<span class="eqbk-existing-main"><span class="eqbk-dot" style="background:'+colorForPerson(r.person)+';display:inline-block"></span>'
          + r.person+' · '+fmtRange(r)+(r.note?(' · '+r.note):'')+(r.seriesId?' · 🔁 반복':'')
          + '<span class="eqbk-status-badge eqbk-status-'+st+'">'+statusLabel(st)+'</span></span>'
          + '<span class="eqbk-existing-actions">'
          + '<button class="eqbk-edit-btn" data-edit="'+r.id+'">수정</button>'
          + (st !== 'ended' ? '<button class="eqbk-end-btn" data-end="'+r.id+'">사용 종료</button>' : '')
          + '<button data-delete="'+r.id+'">삭제</button></span></div>';
      });
      html += '</div>';
    }

    html += '<h2 style="margin-top:16px">'+(editingRes ? '예약 수정' : (modalState.mode==='day' ? '새 예약 추가' : '예약 추가'))+'</h2>';
    html += '<label>장비</label><select id="eqbk-f-equipment">';
    equipment.forEach(eq => {
      const badge = eqStatusLabel(eq);
      html += '<option value="'+eq.id+'" '+(eq.id===defaultEq?'selected':'')+'>'+eq.name+(badge?' ('+badge+')':'')+'</option>';
    });
    html += '</select>';
    html += '<label>이름</label><input id="eqbk-f-person" list="eqbk-people-list" placeholder="예: 김민수" value="'+personVal+'">';
    html += '<datalist id="eqbk-people-list">'+peopleOptions+'</datalist>';
    html += '<label>시작</label><input type="datetime-local" id="eqbk-f-start" value="'+startVal+'">';
    html += '<label>종료</label><input type="datetime-local" id="eqbk-f-end" value="'+endVal+'">';
    html += '<label>메모 (선택)</label><input id="eqbk-f-note" placeholder="예: 실험 A용" value="'+noteVal+'">';
    if (!editingRes){
      html += '<label class="eqbk-checkbox-row"><input type="checkbox" id="eqbk-f-repeat"> 매주 반복</label>';
      html += '<div id="eqbk-repeat-weeks-wrap" style="display:none;"><label>반복 횟수 (주, 이번 주 포함)</label><input type="number" id="eqbk-f-repeat-weeks" value="4" min="2" max="26"></div>';
    }
    html += '<div class="eqbk-modal-actions">';
    html += '<button class="eqbk-btn-secondary" id="eqbk-modal-cancel">취소</button>';
    html += '<button class="eqbk-btn-primary" id="eqbk-modal-save">'+(editingRes ? '수정 저장' : '예약하기')+'</button>';
    html += '</div></div></div>';
    return html;
  }

  function renderEquipmentStatusModal(){
    const eq = equipment.find(e=>e.id===modalState.equipmentId);
    const current = (eq && eq.status) || 'ok';
    const currentNote = (eq && eq.statusNote) || '';
    let html = '<div class="eqbk-overlay" id="eqbk-overlay"><div class="eqbk-modal">';
    html += '<button class="eqbk-modal-close" id="eqbk-modal-close">✕</button>';
    html += '<h2>'+(eq?eq.name:'')+' 상태 변경</h2><div class="eqbk-modal-sub">'+(eq?eq.tag:'')+'</div>';
    html += '<div class="eqbk-status-choice-group">';
    html += '<div class="eqbk-status-choice'+(current==='ok'?' eqbk-status-choice-active':'')+'" data-status-choice="ok">✅ 정상</div>';
    html += '<div class="eqbk-status-choice'+(current==='maintenance'?' eqbk-status-choice-active':'')+'" data-status-choice="maintenance">🔧 점검중</div>';
    html += '<div class="eqbk-status-choice'+(current==='broken'?' eqbk-status-choice-active':'')+'" data-status-choice="broken">⛔ 고장</div>';
    html += '</div>';
    html += '<input type="hidden" id="eqbk-status-value" value="'+current+'">';
    html += '<label>메모 (선택)</label><input id="eqbk-status-note" placeholder="예: 히터 교체중, 재입고 대기" value="'+currentNote+'">';
    html += '<div class="eqbk-hint" style="margin-top:8px;">점검중/고장 상태인 장비는 새 예약이 자동으로 막혀요.</div>';
    html += '<div class="eqbk-modal-actions">';
    html += '<button class="eqbk-btn-secondary" id="eqbk-modal-cancel">취소</button>';
    html += '<button class="eqbk-btn-primary" id="eqbk-status-save">저장</button>';
    html += '</div></div></div>';
    return html;
  }

  function attachHandlers(){
    const q = sel => document.getElementById(sel);
    if (q('eqbk-mode-month')) q('eqbk-mode-month').onclick = () => { viewMode = 'month'; render(); };
    if (q('eqbk-mode-week')) q('eqbk-mode-week').onclick = () => { viewMode = 'week'; weekAnchor = getWeekStart(viewDate); render(); };
    if (q('eqbk-prev')) q('eqbk-prev').onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1); render(); };
    if (q('eqbk-next')) q('eqbk-next').onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1); render(); };
    if (q('eqbk-today2')) q('eqbk-today2').onclick = () => { viewDate = new Date(); render(); };
    if (q('eqbk-week-prev')) q('eqbk-week-prev').onclick = () => { weekAnchor.setDate(weekAnchor.getDate()-7); render(); };
    if (q('eqbk-week-next')) q('eqbk-week-next').onclick = () => { weekAnchor.setDate(weekAnchor.getDate()+7); render(); };
    if (q('eqbk-week-today')) q('eqbk-week-today').onclick = () => { weekAnchor = getWeekStart(new Date()); render(); };
    if (q('eqbk-new-top')) q('eqbk-new-top').onclick = () => { modalState = { mode: 'new' }; render(); };
    if (q('eqbk-fab')) q('eqbk-fab').onclick = () => { modalState = { mode: 'new' }; render(); };

    document.querySelectorAll('.eqbk-day-header').forEach(th => {
      th.onclick = () => {
        weekAnchor = getWeekStart(new Date(th.getAttribute('data-date')));
        viewMode = 'week';
        render();
      };
    });

    document.querySelectorAll('.eqbk-cell, .eqbk-week-cell').forEach(td => {
      td.onclick = () => {
        modalState = { mode: 'day', equipmentId: td.getAttribute('data-eqid'), dateStr: td.getAttribute('data-date') };
        render();
      };
    });

    document.querySelectorAll('.eqbk-eq-name').forEach(el => {
      el.onclick = async (ev) => {
        ev.stopPropagation();
        const id = el.getAttribute('data-eqid');
        const eq = equipment.find(e=>e.id===id);
        const name = prompt('장비 이름 수정', eq.name);
        if (name && name.trim()){
          eq.name = name.trim();
          await saveEquipment();
          render();
        }
      };
    });

    document.querySelectorAll('.eqbk-eq-tag-btn').forEach(el => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        modalState = { mode: 'equipmentStatus', equipmentId: el.getAttribute('data-eqid') };
        render();
      };
    });

    document.querySelectorAll('[data-status-choice]').forEach(el => {
      el.onclick = () => {
        const val = el.getAttribute('data-status-choice');
        if (q('eqbk-status-value')) q('eqbk-status-value').value = val;
        document.querySelectorAll('[data-status-choice]').forEach(x => x.classList.remove('eqbk-status-choice-active'));
        el.classList.add('eqbk-status-choice-active');
      };
    });

    if (q('eqbk-status-save')){
      q('eqbk-status-save').onclick = async () => {
        const eq = equipment.find(e=>e.id===modalState.equipmentId);
        if (eq){
          eq.status = q('eqbk-status-value').value;
          eq.statusNote = q('eqbk-status-note').value.trim();
          await saveEquipment();
        }
        modalState = null;
        render();
      };
    }

    if (q('eqbk-f-repeat')){
      q('eqbk-f-repeat').onchange = () => {
        const wrap = q('eqbk-repeat-weeks-wrap');
        if (wrap) wrap.style.display = q('eqbk-f-repeat').checked ? 'block' : 'none';
      };
    }

    if (q('eqbk-overlay')){
      q('eqbk-overlay').onclick = (e) => { if (e.target.id === 'eqbk-overlay'){ modalState = null; render(); } };
    }
    if (q('eqbk-modal-close')) q('eqbk-modal-close').onclick = () => { modalState = null; render(); };
    if (q('eqbk-modal-cancel')) q('eqbk-modal-cancel').onclick = () => { modalState = null; render(); };

    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-edit');
        modalState = { ...modalState, editingId: id };
        render();
      };
    });

    document.querySelectorAll('[data-end]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.getAttribute('data-end');
        const r = reservations.find(x => x.id === id);
        if (r){
          r.endedAt = new Date().toISOString();
          await saveReservations();
          render();
        }
      };
    });

    document.querySelectorAll('[data-delete]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('정말 삭제하시겠어요? 이 작업은 되돌릴 수 없어요.')) return;
        const id = btn.getAttribute('data-delete');
        reservations = reservations.filter(r => r.id !== id);
        await saveReservations();
        render();
      };
    });

    if (q('eqbk-modal-save')){
      q('eqbk-modal-save').onclick = async () => {
        const equipmentId = q('eqbk-f-equipment').value;
        const person = q('eqbk-f-person').value.trim();
        const start = q('eqbk-f-start').value;
        const end = q('eqbk-f-end').value;
        const note = q('eqbk-f-note').value.trim();
        const editingId = modalState.editingId;
        if (!person){ alert('이름을 입력해주세요'); return; }
        if (!start || !end){ alert('시작/종료 시간을 입력해주세요'); return; }
        if (new Date(end) <= new Date(start)){ alert('종료 시간이 시작 시간보다 늦어야 해요'); return; }

        const eqObj = equipment.find(e=>e.id===equipmentId);
        if (eqObj && eqObj.status && eqObj.status !== 'ok'){
          alert('⚠️ '+eqObj.name+'은(는) 현재 '+(eqObj.status==='maintenance'?'점검중':'고장')+' 상태라 예약할 수 없어요.\n장비 이름 옆 태그(EQ-0N)를 눌러 상태를 확인/변경할 수 있어요.');
          return;
        }

        if (!people.includes(person)){ people.push(person); await savePeople(); }

        if (editingId){
          const target = reservations.find(r => r.id === editingId);
          if (!target){ modalState = null; render(); return; }
          const conflict = reservations.find(r => r.equipmentId === equipmentId && r.id !== editingId &&
            getStatus(r) !== 'ended' &&
            new Date(r.start).getTime() < new Date(end).getTime() &&
            new Date(start).getTime() < new Date(r.end).getTime()
          );
          if (conflict){
            const proceed = confirm('⚠️ 이미 '+conflict.person+'님이 겹치는 시간에 예약했어요 ('+fmtRange(conflict)+').\n그래도 저장하시겠어요?');
            if (!proceed) return;
          }
          target.equipmentId = equipmentId;
          target.person = person;
          target.start = start;
          target.end = end;
          target.note = note;
          await saveReservations();
          modalState = null;
          render();
          return;
        }

        const repeatChecked = q('eqbk-f-repeat') && q('eqbk-f-repeat').checked;
        const weeks = repeatChecked ? Math.max(2, Math.min(26, parseInt(q('eqbk-f-repeat-weeks').value, 10) || 4)) : 1;
        const baseStart = new Date(start);
        const baseEnd = new Date(end);
        const occurrences = [];
        for (let i = 0; i < weeks; i++){
          const s = new Date(baseStart.getTime() + i * 7 * 86400000);
          const e = new Date(baseEnd.getTime() + i * 7 * 86400000);
          occurrences.push({ start: toLocalInput(s), end: toLocalInput(e) });
        }

        const conflicts = occurrences.filter(occ => reservations.find(r => r.equipmentId === equipmentId &&
          getStatus(r) !== 'ended' &&
          new Date(r.start).getTime() < new Date(occ.end).getTime() &&
          new Date(occ.start).getTime() < new Date(r.end).getTime()
        ));
        if (conflicts.length > 0){
          const proceed = confirm('⚠️ '+conflicts.length+'건이 다른 예약과 겹쳐요.\n그래도 전체 예약하시겠어요?');
          if (!proceed) return;
        }

        const seriesId = weeks > 1 ? uid() : null;
        occurrences.forEach(occ => {
          reservations.push({ id: uid(), equipmentId, person, start: occ.start, end: occ.end, note, seriesId });
        });
        await saveReservations();
        modalState = null;
        render();
      };
    }
  }

  function renderSetupBanner(){
    const app = document.getElementById('eqbk-app');
    app.innerHTML = ''
      + '<div class="eqbk-root">'
      + '<div style="max-width:480px;margin:40px auto;text-align:center;font-family:Inter,sans-serif;">'
      + '<div style="font-size:32px;margin-bottom:12px;">🔧🔥</div>'
      + '<h1 style="font-size:18px;margin-bottom:8px;">Firebase 설정이 필요해요</h1>'
      + '<p style="color:#6B6F68;font-size:13.5px;line-height:1.6;">'
      + '이 파일 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 설정으로 바꿔주세요.<br>'
      + 'Firebase 콘솔 → 프로젝트 설정 → 일반 → 내 앱 에서 값을 복사할 수 있어요.'
      + '</p></div></div>';
  }

  (async function init(){
    if (!firebaseConfig || firebaseConfig.apiKey === 'YOUR_API_KEY_HERE'){
      renderSetupBanner();
      return;
    }
    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      eqRef = db.ref('equipment');
      resRef = db.ref('reservations');
      pplRef = db.ref('people');
      await initFirebaseData();
      attachListeners();
    } catch(e){
      console.error('Firebase init failed', e);
      const app = document.getElementById('eqbk-app');
      app.innerHTML = '<div class="eqbk-empty">Firebase 연결에 실패했어요. 콘솔(F12)에서 오류 메시지를 확인해주세요.</div>';
    }
  })();
})();
</script>
</body>
</html>
